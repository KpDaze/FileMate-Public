name: FileMate one-shot Stage 3D Android proof
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage3d-one-shot-emulator.yml
permissions:
  contents: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[stage3d-emulator-rerun]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Verify Stage 3D with disposable media
        env:
          FILEMATE_STAGE3D_ONLY: '1'
          FILEMATE_STAGE3C_ONLY: '0'
          FILEMATE_STAGE3B_ONLY: '0'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/verify-gallery-emulator.sh
