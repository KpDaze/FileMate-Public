name: FileMate one-shot Stage 3D build
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage3d-one-shot-build.yml
permissions:
  contents: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[stage3d-build-one-shot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build, test and lint final Stage 3D source
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
