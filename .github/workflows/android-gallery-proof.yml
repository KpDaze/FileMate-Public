name: FileMate Gallery Android proof

on:
  # Temporary push trigger for Kel's already-approved single Stage 3C proof run.
  # The verify job is gated by the one-shot commit marker below.
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-gallery-proof.yml'
  # Dispatch only after Kel approves this specific emulator run.
  workflow_dispatch:
    inputs:
      stage3c_only:
        description: 'Focused Stage 3C image comparison probe and UI; no older emulator flows'
        type: boolean
        required: false
        default: false
      stage3b_only:
        description: 'Skip the already-passed older UI flow; verify Stage 3B plus media probes'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: filemate-gallery-android-proof
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[stage3c-one-shot]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Verify read-only Gallery with disposable media
        env:
          FILEMATE_STAGE3C_ONLY: ${{ (github.event_name == 'push' || inputs.stage3c_only) && '1' || '0' }}
          FILEMATE_STAGE3B_ONLY: ${{ inputs.stage3b_only && '1' || '0' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/verify-gallery-emulator.sh
